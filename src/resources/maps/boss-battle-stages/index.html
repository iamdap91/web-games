<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>산길·서리숲·잿불협곡·대숲 · 전투맵 8종</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main data-view="compare">
      <header>
        <div>
          <span class="eyebrow">FOUR REGIONS / EIGHT BATTLE MAPS</span>
          <h1>산길 · 서리숲 · 잿불협곡 · 대숲</h1>
          <p>
            지역마다 두 전장과 두 이동길. 같은 파티와 보스가 서는 공간을 나란히
            비교하고 직접 숲길을 걸어봅니다.
          </p>
        </div>
        <div class="page-actions">
          <div class="view-controls" role="group" aria-label="전투맵 보기">
            <button
              id="view-compare"
              aria-pressed="true"
              aria-controls="stages"
            >
              나란히 비교
            </button>
            <button id="view-game" aria-pressed="false" aria-controls="stages">
              인게임 크기
            </button>
          </div>
          <button id="pause" aria-pressed="false" disabled>움직임 멈춤</button>
        </div>
      </header>
      <p id="view-description" class="view-description" role="status">
        실제 보스전과 같은 16:10 비율 · 지역마다 두 전장을 나란히 비교합니다.
      </p>
      <section
        id="stages"
        class="stages"
        aria-label="지역별 기존·추가 보스 전투맵 여덟 곳"
      ></section>
      <footer>
        <span>아타호 · 연묵 · 비월과 각 지역의 보스</span>
        <span id="status" role="status">여덟 곳의 전투맵을 불러오는 중…</span>
      </footer>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/maps/boss-battle-stages/index.js"
    ></script>
  </body>
</html>
