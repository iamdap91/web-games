<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>오래된 나루 · 레트로 3D 마을</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../catalog/embedded-scene.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../node_modules/three/build/three.module.js",
          "three/addons/": "../../../../node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">VILLAGE STYLE / RETRO</span>
          <h1>오래된 나루</h1>
          <p>
            작은 픽셀을 붙인 돌벽과 목재지붕. 시장 골목을 지나 나루를 걷는다.
          </p>
        </div>
        <div class="controls">
          <button id="overview" aria-pressed="false">전체 조망 · M</button
          ><button id="restore">도장 복구 · R</button
          ><button id="pause">멈춤 · Esc</button
          ><button id="reset">입구로</button>
        </div>
      </header>
      <div class="stage">
        <canvas tabindex="0" aria-label="오래된 나루 보행 화면"></canvas>
        <aside class="route">
          <b>시장과 나루 한 바퀴</b><span data-place="hearth">01 불씨 공방</span
          ><span data-place="dojo">02 나루 도장</span
          ><span data-place="rest">03 뱃사공 쉼터</span>
        </aside>
        <div id="prompt" hidden></div>
        <div id="notice" role="status" hidden></div>
        <div id="paused" hidden>
          잠시 멈춤 <small>Esc 또는 계속 버튼</small>
        </div>
      </div>
      <footer>
        <span>WASD / 방향키 · 화면을 눌러 이동</span
        ><button id="interact" disabled>근처 시설 사용 · Space</button
        ><span id="status">아타호를 불러오는 중…</span>
      </footer>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/maps/village-style-retro/index.js"
    ></script>
  </body>
</html>
