<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>네 지역의 마을 · 이계취호전</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="settlement">
      <header>
        <div>
          <p class="eyebrow">VILLAGE NOTES / REST BEFORE THE JOURNEY</p>
          <h1 id="name">네 지역의 마을</h1>
          <p id="description"></p>
        </div>
        <a href="../../?category=maps">리소스 라이브러리</a>
      </header>
      <nav id="regions" aria-label="마을 선택"></nav>
      <div class="view-controls">
        <label
          >보기
          <select id="view">
            <option value="game">인게임 시야</option>
            <option value="overview">지도 전체</option>
          </select></label
        >
      </div>
      <p id="view-note"></p>
      <div class="journey">
        <section class="stage" aria-label="직접 걷는 마을">
          <canvas
            tabindex="0"
            aria-label="아타호 지역 보행. 방향키 또는 WASD로 이동하고 Space로 시설을 살펴봅니다."
          ></canvas>
          <div id="zone-indicator">
            <span id="zone-region">지역 탐험</span
            ><strong id="zone-name">남쪽 공통 입구</strong>
          </div>
          <div id="landmark-tags" aria-hidden="true"></div>
          <div id="loading" class="cover" role="status">
            마을을 준비하고 있습니다…
          </div>
          <div id="paused" class="cover" hidden>잠시 쉬는 중</div>
          <div class="stage-caption">
            <span id="walking-status">길을 따라 걸어보세요.</span
            ><span>방향키 · WASD / 길 클릭</span>
          </div>
        </section>
        <aside>
          <div class="field-heading">
            <span class="eyebrow">시설과 생활</span
            ><span id="visit-count">0 / 6</span>
          </div>
          <div id="landmarks"></div>
          <button id="inspect" type="button">
            가까운 곳 살펴보기 <kbd>Space</kbd>
          </button>
          <p id="notice" role="status">
            표식 가까이에서 주변을 살펴보세요. 명소 이름을 누르면 그곳까지
            걸어갑니다.
          </p>
          <div class="battle-links">
            <span class="eyebrow">마을 밖으로</span
            ><a id="trail-exit" hidden></a>
            <p>남쪽 길목에서 살펴보면 지역 탐험길로 나갈 수 있습니다.</p>
          </div>
        </aside>
      </div>
      <footer>
        <div>
          <button id="paths" aria-pressed="false">길 윤곽 <kbd>M</kbd></button
          ><button id="pause" aria-pressed="false">
            잠시 멈춤 <kbd>Esc</kbd></button
          ><button id="reset">입구로 <kbd>R</kbd></button>
        </div>
        <p id="journey-description">
          마을의 골목을 걷고 시설과 생활 소품을 살펴보세요.
        </p>
      </footer>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/maps/regional-settlements/index.js"
    ></script>
  </body>
</html>
