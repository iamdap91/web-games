<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>네 지역의 길 · 이계취호전</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../node_modules/three/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main id="trail">
      <header>
        <div>
          <p class="eyebrow">FIELD NOTES / WALK THE REGION</p>
          <h1 id="name">네 지역의 길</h1>
          <p id="description"></p>
        </div>
        <a id="village-return">지역 마을 둘러보기 →</a>
        <a href="../boss-battle-stages/" target="_blank" rel="noopener"
          >전투맵 8종 비교 ↗</a
        >
      </header>
      <nav id="regions" aria-label="이동 지역 선택"></nav>
      <div class="view-controls">
        <nav id="routes" aria-label="지역 이동길 선택"></nav>
        <label
          >보기
          <select id="view">
            <option value="game">인게임 시야</option>
            <option value="overview">지도 전체</option>
          </select></label
        >
      </div>
      <p id="view-note"></p>
      <div class="journey">
        <section class="stage" aria-label="직접 걷는 이동맵">
          <canvas
            tabindex="0"
            aria-label="아타호 지역 보행. 방향키 또는 WASD로 이동하고 Space로 명소를 살펴봅니다."
          ></canvas>
          <div id="zone-indicator" hidden>
            <span id="zone-region">지역 탐험</span
            ><strong id="zone-name">남쪽 공통 입구</strong>
          </div>
          <div id="landmark-tags" aria-hidden="true"></div>
          <div id="loading" class="cover" role="status">
            지역의 길을 준비하고 있습니다…
          </div>
          <div id="paused" class="cover" hidden>잠시 쉬는 중</div>
          <div class="stage-caption">
            <span id="walking-status">길을 따라 걸어보세요.</span
            ><span>방향키 · WASD / 길 클릭</span>
          </div>
        </section>
        <aside>
          <div class="field-heading">
            <span class="eyebrow">이 길의 풍경</span
            ><span id="visit-count">0 / 3</span>
          </div>
          <div id="landmarks"></div>
          <button id="inspect" type="button">
            가까운 곳 살펴보기 <kbd>Space</kbd>
          </button>
          <p id="notice" role="status">
            표식 가까이에서 주변을 살펴보세요. 명소 이름을 누르면 그곳까지
            걸어갑니다.
          </p>
          <div class="battle-links">
            <span class="eyebrow">길 너머의 전장</span
            ><a id="battle-original" target="_blank" rel="noopener"></a
            ><a id="battle-alternate" target="_blank" rel="noopener"></a>
          </div>
        </aside>
      </div>
      <footer>
        <div>
          <button id="paths" aria-pressed="false">길 윤곽 <kbd>M</kbd></button
          ><button id="pause" aria-pressed="false">
            잠시 멈춤 <kbd>Esc</kbd></button
          ><button id="reset">입구로 <kbd>R</kbd></button>
        </div>
        <p id="journey-description">
          길을 걷고, 세 곳의 표식을 살펴보고, 같은 지역의 두 전투맵과 비교해
          보세요.
        </p>
      </footer>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/maps/regional-trails/index.js"
    ></script>
  </body>
</html>
