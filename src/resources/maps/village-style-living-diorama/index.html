<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>저녁이 깃든 마당 · 디오라마·생활 조합</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../catalog/embedded-scene.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "../../../../node_modules/three/build/three.module.js",
          "three/addons/": "../../../../node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <header>
        <div>
          <span class="eyebrow">VILLAGE LIFE / 02</span>
          <h1>저녁이 깃든 마당</h1>
          <p>
            화덕의 붓질, 도장의 수련, 천시장의 빨래. 낮과 저녁을 걸어서
            비교한다.
          </p>
        </div>
        <div class="controls">
          <button id="period" aria-pressed="false">저녁 보기 · T</button>
          <button id="light" aria-pressed="true">화덕 빛 · L</button
          ><button id="normal" aria-pressed="true">소재 요철 · N</button
          ><button id="overview" aria-pressed="false">전체 조망 · M</button
          ><button id="restore">도장 복구 · R</button
          ><button id="pause">멈춤 · Esc</button
          ><button id="reset">입구로</button>
        </div>
      </header>
      <div class="stage">
        <canvas tabindex="0" aria-label="저녁이 깃든 마당 보행 화면"></canvas>
        <aside class="route">
          <b>일하고 쉬는 마당 한 바퀴</b
          ><span data-place="hearth">01 안료 화덕 마당</span
          ><span data-place="dojo">02 붓결 도장 복구</span
          ><span data-place="rest">03 담 뒤 천 쉼터</span
          ><span data-place="market">04 천 펼치기 → 입구 귀환</span>
        </aside>
        <div id="prompt" hidden></div>
        <div id="notice" role="status" hidden></div>
        <div id="paused" hidden>
          잠시 멈춤 <small>Esc 또는 계속 버튼</small>
        </div>
      </div>
      <footer>
        <span>WASD / 방향키 · 화면을 눌러 이동</span
        ><button id="interact" disabled>근처 시설 사용 · Space</button
        ><span id="status">아타호를 불러오는 중…</span>
      </footer>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/maps/village-style-living-diorama/index.js"
    ></script>
  </body>
</html>
