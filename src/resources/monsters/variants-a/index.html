<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="style.css" />
    <title>몬스터 배치 A · 리소스 검토</title>
    <link rel="stylesheet" href="../../catalog/detail-navigation.css" />
  </head>
  <body>
    <main>
      <a href="../../">리소스 목록</a>
      <h1>몬스터 배치 A</h1>
      <p>
        숲·습지·능선의 15종. 원본과 실제 프레임 모션을 같은 발 기준으로
        재생합니다.
      </p>
      <div class="controls">
        <label
          >모션
          <select id="motion">
            <option value="stand">대기</option>
            <option value="move">이동</option>
            <option value="attack1">공격·시전</option>
            <option value="hit1">피격</option>
            <option value="die1">쓰러짐</option>
          </select></label
        >
        <label
          >배율
          <select id="scale">
            <option value="2">2배</option>
            <option value="3" selected>3배</option>
            <option value="4">4배</option>
          </select></label
        >
        <label
          >바탕
          <select id="background">
            <option value="light">밝게</option>
            <option value="dark">어둡게</option>
          </select></label
        >
        <button id="toggle" type="button">일시정지</button>
        <button id="restart" type="button">처음부터</button>
      </div>
      <p id="status" role="status">로컬 리소스를 불러오는 중…</p>
      <section id="monsters" aria-label="몬스터 모션 검토"></section>
      <footer>
        <p>
          단발 동작은 마지막 자세를 유지합니다. 다시 재생하려면 처음부터를
          누르세요.
        </p>
        <a href="../../../../resources/monsters-a-generation.json"
          >원본·생성 기록</a
        >
      </footer>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/monsters/variants-a/index.js"
    ></script>
    <script
      type="module"
      src="../../../../dist/src/resources/catalog/detail-navigation.js"
    ></script>
  </body>
</html>
