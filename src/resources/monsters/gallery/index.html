<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#173c32" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../../preview/style.css" />
    <link rel="stylesheet" href="../../preview/originals.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>몬스터 · 모션 갤러리</title>
    <link rel="stylesheet" href="../../catalog/detail-navigation.css" />
  </head>
  <body>
    <main>
      <nav aria-label="검토 화면">
        <a href="../../">리소스 목록</a>
        
        
      </nav>
      <header>
        <div>
          <p class="eyebrow">WEB GAMES / MONSTERS</p>
          <h1>몬스터 모션 갤러리</h1>
          <p class="intro">
            몬스터를 골라 대기·이동·공격·피격·쓰러짐을 살펴보세요.
          </p>
        </div>
        <span class="badge">로컬 리소스</span>
      </header>
      <div class="gallery-layout">
        <aside class="gallery-selection" aria-label="몬스터와 모션 선택">
          <section class="gallery-filters" aria-label="몬스터 필터">
            <label
              >테마<select id="theme">
                <option value="">전체 테마</option>
              </select></label
            >
            <label
              >역할<select id="role">
                <option value="">전체 역할</option>
              </select></label
            >
            <label
              >몬스터<select id="monster" aria-label="몬스터 선택"></select
            ></label>
          </section>
          <p id="count" role="status"></p>
          <p id="monster-summary"></p>
          <section class="controls" aria-label="모션 설정">
            <label
              >자세<select
                id="motion"
                disabled
                aria-label="선택한 몬스터 모션"
              ></select
              ><output id="frame">—</output></label
            >
            <div class="playback-buttons">
              <button id="toggle" type="button" disabled>일시정지</button>
              <button id="restart" type="button" disabled>처음부터</button>
            </div>
          </section>
          <p id="motion-notes" aria-live="polite"></p>
        </aside>
        <section class="stage" aria-label="선택한 몬스터 모션">
          <div class="stage-top">
            <span>모션 미리보기</span><span id="monster-name"></span>
          </div>
          <canvas
            id="scene"
            width="960"
            height="480"
            aria-label="몬스터 모션 미리보기"
            >캔버스를 지원하는 브라우저에서 확인해 주세요.</canvas
          >
          <p id="status" role="status">목록을 준비하는 중…</p>
        </section>
      </div>
      <details id="originals-panel" class="originals-panel" hidden>
        <summary>원본과 생성 자료</summary>
        <div id="originals"></div>
      </details>
    </main>
    <script
      type="module"
      src="../../../../dist/src/resources/monsters/gallery/index.js"
    ></script>
    <script
      type="module"
      src="../../../../dist/src/resources/catalog/detail-navigation.js"
    ></script>
  </body>
</html>
